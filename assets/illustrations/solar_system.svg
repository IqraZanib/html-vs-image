<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="500" height="220" fill="#0B1026"/>
  <circle cx="20" cy="30" r="1.5" fill="#FFF"/>
  <circle cx="60" cy="15" r="1" fill="#FFF"/>
  <circle cx="300" cy="20" r="1.5" fill="#FFF"/>
  <circle cx="400" cy="35" r="1" fill="#FFF"/>
  <circle cx="450" cy="15" r="1.5" fill="#FFF"/>
  <circle cx="200" cy="190" r="1" fill="#FFF"/>
  <circle cx="350" cy="195" r="1.5" fill="#FFF"/>

  <!-- orbit lines -->
  <g fill="none" stroke="#37415A" stroke-width="1">
    <ellipse cx="30" cy="110" rx="55" ry="4"/>
    <ellipse cx="30" cy="110" rx="90" ry="4"/>
    <ellipse cx="30" cy="110" rx="130" ry="4"/>
    <ellipse cx="30" cy="110" rx="175" ry="4"/>
    <ellipse cx="30" cy="110" rx="230" ry="4"/>
    <ellipse cx="30" cy="110" rx="290" ry="4"/>
    <ellipse cx="30" cy="110" rx="355" ry="4"/>
    <ellipse cx="30" cy="110" rx="420" ry="4"/>
  </g>

  <!-- sun -->
  <circle cx="30" cy="110" r="26" fill="#FFD54F"/>
  <g stroke="#FFCA28" stroke-width="3">
    <line x1="30" y1="76" x2="30" y2="66"/>
    <line x1="30" y1="144" x2="30" y2="154"/>
    <line x1="0" y1="110" x2="-10" y2="110"/>
  </g>

  <!-- Mercury -->
  <circle cx="85" cy="110" r="5" fill="#B0BEC5" stroke="#78909C" stroke-width="1"/>
  <!-- Venus -->
  <circle cx="120" cy="110" r="8" fill="#FFCA80" stroke="#EF9A45" stroke-width="1"/>
  <!-- Earth -->
  <circle cx="160" cy="110" r="9" fill="#42A5F5" stroke="#1565C0" stroke-width="1.5"/>
  <path d="M154,105 Q160,103 165,107 Q158,112 154,109 Z" fill="#66BB6A"/>
  <!-- Mars -->
  <circle cx="205" cy="110" r="7" fill="#E57373" stroke="#C62828" stroke-width="1"/>
  <!-- Jupiter -->
  <circle cx="260" cy="110" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="1.5"/>
  <path d="M242,104 Q260,108 278,102" stroke="#EF6C00" stroke-width="2" fill="none"/>
  <path d="M242,116 Q260,112 278,120" stroke="#EF6C00" stroke-width="2" fill="none"/>
  <!-- Saturn -->
  <circle cx="320" cy="110" r="17" fill="#FFE0A3" stroke="#D4A54A" stroke-width="1.5"/>
  <ellipse cx="320" cy="110" rx="32" ry="7" fill="none" stroke="#C9A66B" stroke-width="3"/>
  <!-- Uranus -->
  <circle cx="385" cy="110" r="13" fill="#80DEEA" stroke="#00838F" stroke-width="1.5"/>
  <!-- Neptune -->
  <circle cx="450" cy="110" r="12" fill="#5C6BC0" stroke="#283593" stroke-width="1.5"/>
</svg>
